<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호호박사의 과학 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: a field notebook. Shell bar on top; each view is an illustrated stage with guide, controls and results below.
   One deliberate light look: the watercolor-style illustration is the point, so no dark variant. */
:root{
  --paper:#f4eedf; --paper-2:#fbf8f0; --ink:#3b3226; --ink-soft:#6d604c; --line:#d8ccb2;
  --leaf:#4f7a3f; --leaf-dark:#3c5f30; --clay:#c45f33; --clay-dark:#9c4524; --gold:#d9a23a;
  --low:#2f8f86; --mid:#d9822b; --high:#7c62ad;
  --display:"Jua","Gowun Dodum","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.span2{grid-column:span 2}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--mid);outline-offset:2px}

/* shell */
.shell{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-size:20px}
.brand svg{width:34px;height:auto}
.nav{display:flex;gap:6px}
.navbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--display);font-size:16px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2)}
.navbtn.on{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.navbtn b{font-weight:400;color:var(--clay)}
.navbtn.on b{color:#ffd59a}
.navbtn.pop{animation:pop .6s ease}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
#view>div{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}

/* experiment header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
.eyebrow{margin:0;font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.15;text-wrap:balance}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:4px;font-family:var(--display);font-size:16px}
.steps li{padding:5px 12px;border-radius:999px;color:var(--ink-soft);border:1px solid transparent}
.steps li.done{color:var(--leaf-dark)}
.steps li.done::before{content:"✓ "}
.steps li.now{background:var(--paper-2);border-color:var(--line);color:var(--ink)}
.tools{display:flex;align-items:center;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--ink-soft);text-decoration:none;font-size:15px}

/* stage */
.stage-wrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#e8f1ea}
.stage{display:block;width:100%;height:auto;touch-action:manipulation}
.stage text{font-family:var(--body)}
.legend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-top:-4px}
.legend svg{width:16px;height:16px;color:#8a6e48;flex:none}

/* panel */
.panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.guide{display:flex;gap:12px;align-items:flex-start}
.portrait{flex:0 0 86px;width:86px}
.portrait svg{width:100%;height:auto;display:block}
.portrait.cheer{animation:hop .7s ease}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;line-height:1.5}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.who{display:block;font-family:var(--display);font-size:14px;color:var(--ink-soft);margin-bottom:2px}
.bubble b{font-weight:400;font-family:var(--display);color:var(--clay-dark)}
.lab{margin:0 0 8px;font-family:var(--display);font-size:17px;display:block}
.angles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ang{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;font-family:var(--display);font-size:16px}
.ang svg{width:100%;max-width:120px;height:auto}
.ang.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.ang .done{position:absolute;top:4px;right:6px;font-style:normal;color:var(--c);font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-soft)}
.lock svg{width:16px;height:18px}
.throw{font-family:var(--display);font-size:22px;padding:10px 26px;border:none;border-radius:12px;background:var(--clay);color:#fffaf2;box-shadow:0 3px 0 var(--clay-dark);transition:transform .08s}
.throw:active{transform:translateY(2px);box-shadow:0 1px 0 var(--clay-dark)}
.throw[disabled]{opacity:.55;cursor:default}
.btn{font-family:var(--display);font-size:18px;padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.primary{background:var(--leaf);border-color:var(--leaf-dark);color:#fbfff6;box-shadow:0 3px 0 var(--leaf-dark)}
.btn.small{font-size:15px;padding:6px 14px}
.btn.wide{width:100%;margin-top:8px}
.btn.glow{animation:glow 1.6s ease-in-out infinite}
.btn[disabled]{opacity:.5;cursor:default}
.chart{width:100%;height:auto;display:block}
.chart .ax{font-size:11px;fill:#8a7a5c}
.chart .val{font-family:var(--display);font-size:17px;fill:#3b3226}
.chart .nm{font-family:var(--display);font-size:14px;fill:#3b3226}
.chart .q{font-family:var(--display);font-size:20px;fill:#b8ab90}
.chart .pred{font-size:12px;fill:#9c4524}
.slide{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;color:var(--ink-soft)}
.slide input{flex:1;min-width:0;accent-color:var(--leaf);height:36px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.world{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px;display:grid;justify-items:center;gap:4px;font-family:var(--display);font-size:15px}
.world svg{width:44px;height:44px}
.world.on{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf) inset}
.score{margin:12px 0 0;font-family:var(--display);font-size:18px}
.score b{font-weight:400;color:var(--clay);font-size:24px}

/* seesaw */
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.token{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 8px;display:grid;justify-items:center;gap:2px;min-width:86px;font-family:var(--display);font-size:15px}
.token svg.an{width:56px;height:56px}
.token.on{border-color:var(--clay);box-shadow:0 0 0 2px var(--clay) inset;background:#fff7ef}
.token.used{opacity:.35}
.wts{display:flex;gap:2px;align-items:flex-end}
.wts svg{width:13px;height:13px}
.mtable{width:100%;border-collapse:collapse;font-size:15px}
.mtable th{font-weight:400;font-size:13px;color:var(--ink-soft);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.mtable td{padding:6px;border-bottom:1px solid #ece3cf;vertical-align:middle}
.mtable td svg.an{width:36px;height:36px;display:block}
.mtable td svg.rigmini{width:64px;height:40px;display:block;border-radius:4px}
.mtable .seatno{font-family:var(--display);font-size:22px;color:var(--clay-dark)}
.mtable .wait{color:#b8ab90}
.mathbox{margin-top:10px;font-size:15px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.mathbox b{font-weight:400;font-family:var(--display)}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--leaf)}

/* float or sink */
.objs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.obj{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:4px 2px 6px;display:grid;justify-items:center;gap:0;font-family:var(--display);font-size:14px;position:relative}
.obj svg{width:44px;height:44px}
.obj small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.obj.on{border-color:var(--clay);box-shadow:0 0 0 2px var(--clay) inset;background:#fff7ef}
.obj[disabled]{opacity:.38;cursor:default}
.guess{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.guess button{font-family:var(--display);font-size:17px;padding:10px 6px;border-radius:12px;border:none;color:#fff;display:grid;justify-items:center;gap:2px}
.guess .up{background:#3f86b8;box-shadow:0 3px 0 #2a5f86}
.guess .down{background:#6a5a8a;box-shadow:0 3px 0 #4a3d66}
.guess button[disabled]{opacity:.5}
.sortcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scol{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:96px}
.scol h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:15px}
.sicons{display:flex;flex-wrap:wrap;gap:4px}
.sicon{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;border:2px solid transparent;background:#f8f5ec}
.sicon svg{width:34px;height:34px}
.sicon.ok{border-color:#4f7a3f}
.sicon.miss{border-color:#d9822b;border-style:dashed}
.big .sicon{width:58px;height:58px}.big .sicon svg{width:48px;height:48px}
.spoons{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.spoons span{width:30px;height:22px;border-radius:0 0 14px 14px;border:1.5px solid #9aa1a7;background:#fff}
.spoons span.full{background:radial-gradient(circle at 50% 30%,#ffffff,#e6e9ec);border-color:#6d7378}
.btns{display:grid;gap:8px}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(59,50,38,.42);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.ov-card{width:min(720px,100%);background:var(--paper-2);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;box-shadow:0 18px 40px rgba(59,50,38,.25);animation:rise .35s ease}
.ov-card h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;text-wrap:balance}
.ov-card p{margin:0}
.chars{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.chars svg{height:150px;width:auto}
.chars svg.sq{height:110px}
.center{text-align:center;justify-items:center}
.lead{font-size:19px}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk .portrait{flex-basis:64px;width:64px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 6px 10px;display:grid;justify-items:center;gap:4px;font-family:var(--display);font-size:19px;transition:transform .12s,border-color .12s}
.pick:hover{transform:translateY(-2px);border-color:var(--c,var(--clay))}
.pick svg{width:100%;height:auto}
.dcard{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:#fffdf6;border:1.5px solid #e1c98f;border-radius:14px;padding:14px;box-shadow:0 2px 0 #e1c98f}
.dcard svg{width:100%;height:auto;display:block}
.dno{font-size:13px;letter-spacing:.06em;color:#9c7a2e}
.dtext{font-family:var(--display);font-size:22px;line-height:1.3}
.dsub{font-size:15px;color:var(--ink-soft);margin-top:4px!important}
.ov-chart{max-width:420px;width:100%;justify-self:center}

/* map */
.map-top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px}
.zone{cursor:pointer;outline:none}
.zone .ring{fill:#fff;fill-opacity:0;stroke:#fff;stroke-opacity:0;stroke-width:3;transition:fill-opacity .15s,stroke-opacity .15s}
.zone:hover .ring,.zone:focus-visible .ring{fill-opacity:.18;stroke-opacity:.9}
.zone:focus-visible .ring{stroke:#d9822b}
.prog{display:grid;gap:6px}
.prog-bar{height:12px;border-radius:999px;background:#e7dcc4;overflow:hidden;border:1px solid var(--line)}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#e0b04a,#d9822b);border-radius:999px}
.prog p{margin:0;font-size:15px;color:var(--ink-soft)}
.prog b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.zbtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.zbtn strong{font-family:var(--display);font-weight:400;font-size:18px}
.zbtn span{font-size:13px;color:var(--ink-soft)}
.zbtn em{font-style:normal;font-size:13px;color:var(--leaf-dark)}
.zbtn em.soon{color:#a89878}
.xlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.xitem{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start}
.xitem svg.xart{width:100%;height:auto;border-radius:8px;display:block}
.xitem h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.xitem p{margin:0;font-size:14px;color:var(--ink-soft)}
.xitem .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.xitem .got{font-size:13px;color:#9c7a2e}
.xitem.soon{background:#f6f1e5;border-style:dashed}
.xitem.soon h3{color:#8f826a}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:#ece3cf;color:#8f826a}

/* home menu: one colour per zone, every experiment a big button */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.zone-sec{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.zone-h{margin:0;display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:400;font-size:21px;color:var(--z)}
.zone-h small{font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.zdot{width:12px;height:12px;border-radius:50%;background:var(--z);flex:none;align-self:center}
.xbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.xbtn{display:grid;gap:4px;align-content:start;padding:12px 12px 10px;border-radius:12px;background:var(--z);color:#fff;text-decoration:none;box-shadow:0 3px 0 color-mix(in srgb,var(--z) 70%,#000);transition:transform .12s,box-shadow .12s;min-height:104px}
.xbtn:hover{transform:translateY(-2px);box-shadow:0 5px 0 color-mix(in srgb,var(--z) 70%,#000)}
.xbtn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--z) 70%,#000)}
.xbtn strong{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.xbtn span{font-size:13px;line-height:1.4;opacity:.92}
.xbtn em{font-style:normal;font-size:12px;display:flex;align-items:center;gap:4px;margin-top:auto;opacity:.95}
.xbtn em i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;display:inline-block}
.xbtn em i.on{background:#ffe08a;border-color:#ffe08a}
.xbtn.soon{background:#ece6d8;color:#8f826a;box-shadow:none;border:1.5px dashed #cdbf9f}
@media (prefers-reduced-motion:reduce){.xbtn{transition:none}}

/* card book */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ccard{background:#fffdf6;border:1.5px solid #e1c98f;border-radius:14px;padding:12px;display:grid;gap:8px;align-content:start;box-shadow:0 2px 0 #e1c98f}
.ccard svg{width:100%;height:auto;display:block;border-radius:6px}
.ccard .dtext{font-size:18px}
.ccard.locked{background:#f3eee2;border:1.5px dashed #cdbf9f;box-shadow:none}
.ccard.locked .qart{aspect-ratio:160/96;border-radius:6px;background:repeating-linear-gradient(45deg,#ebe3d0 0 8px,#f1eadb 8px 16px);display:grid;place-items:center;font-family:var(--display);font-size:34px;color:#c2b393}
.ccard.locked .dtext{color:#a89878;font-size:16px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* teacher notes */
.teacher{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.teacher summary{font-family:var(--display);font-size:17px;cursor:pointer}
.teacher-body{display:grid;gap:10px;margin-top:10px;max-width:72ch;font-size:15px}
.teacher-body h3{margin:0;font-size:15px;font-family:var(--display);font-weight:400;color:var(--leaf-dark)}
.teacher-body p,.teacher-body ul{margin:0}
.teacher-body ul{padding-left:20px}

@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.15)}}
@keyframes rise{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 3px 0 var(--leaf-dark),0 0 0 0 rgba(79,122,63,.5)}50%{box-shadow:0 3px 0 var(--leaf-dark),0 0 0 8px rgba(79,122,63,0)}}
@media (prefers-reduced-motion:reduce){.portrait.cheer,.navbtn.pop,.ov-card,.btn.glow{animation:none}}

@media (max-width:900px){.panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.panel .guide-box,.span2{grid-column:1/-1}}
@media (max-width:600px){
  .panel{grid-template-columns:minmax(0,1fr)}
  .cards-grid,.xlist{grid-template-columns:minmax(0,1fr)}
  .steps{font-size:14px}.steps li{padding:4px 8px}
  .dcard{grid-template-columns:1fr}
  .dcard svg{max-width:200px}
  .chars svg{height:110px}.chars svg.sq{height:80px}
  .pick{font-size:16px}
  .ov-card{padding:16px}
  .brand span{font-size:17px}
  .navbtn{padding:5px 10px;font-size:15px}
}
</style>

<!-- shared illustration library -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="owlBody" cx=".45" cy=".35" r=".75"><stop offset="0" stop-color="#bf9161"/><stop offset=".55" stop-color="#8f633a"/><stop offset="1" stop-color="#5e3f22"/></radialGradient>
    <linearGradient id="owlDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a301a"/><stop offset="1" stop-color="#7a5432"/></linearGradient>
    <radialGradient id="owlFace" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#f2dfba"/><stop offset="1" stop-color="#d2ae7c"/></radialGradient>
